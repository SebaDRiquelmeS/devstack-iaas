---
- name: Instalar OpenStack DevStack en Ubuntu 24.04
  hosts: devstack
  become: true
  vars:
    stack_dir: /opt/stack/devstack
    devstack_revision: da2f4d73f5ad74fc8ecfbe15bd7e20f6b0982dbb
  tasks:
    - name: Comprobar distribución, arquitectura e IP de gestión
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '24.04'
          - ansible_facts.architecture == 'x86_64'
          - devstack_host_ip in ansible_facts.all_ipv4_addresses
        fail_msg: Usa Ubuntu Server 24.04 amd64 con una IPv4 estable asignada al nodo.

    - name: Validar contraseña alfanumérica
      ansible.builtin.assert:
        that:
          - (devstack_admin_password | default('')) is match('^[A-Za-z0-9]{16,64}$')
      no_log: true

    - name: Comprobar que KVM está expuesto al nodo
      ansible.builtin.stat:
        path: /dev/kvm
      register: kvm

    - name: Exigir el dispositivo de KVM
      ansible.builtin.assert:
        that: kvm.stat.ischr | default(false)
        fail_msg: Habilita VT-x o AMD-V y, si el nodo es virtual, habilita virtualización anidada.

    - name: Instalar dependencias de arranque
      ansible.builtin.apt:
        name:
          - git
          - sudo
          - ca-certificates
          - acl
        update_cache: true
        cache_valid_time: 3600

    - name: Crear usuario de servicio
      ansible.builtin.user:
        name: stack
        home: /opt/stack
        shell: /bin/bash
        create_home: true

    - name: Permitir que los servicios atraviesen el directorio de stack
      ansible.builtin.file:
        path: /opt/stack
        state: directory
        owner: stack
        mode: '0755'

    - name: Dar privilegios de instalación a stack
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-devstack
        content: "stack ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Obtener la revisión de DevStack 2026.1
      become_user: stack
      ansible.builtin.git:
        repo: https://opendev.org/openstack/devstack
        dest: "{{ stack_dir }}"
        version: "{{ devstack_revision }}"

    - name: Preparar directorio de logs
      ansible.builtin.file:
        path: /opt/stack/logs
        state: directory
        owner: stack
        mode: '0750'

    - name: Comprobar si el nodo ya está instalado
      ansible.builtin.stat:
        path: /opt/stack/.devstack-installed
      register: installed

    - name: Aplicar configuración de laboratorio
      ansible.builtin.template:
        src: local.conf.j2
        dest: "{{ stack_dir }}/local.conf"
        owner: stack
        mode: '0600'
      when: not installed.stat.exists
      no_log: true

    - name: Instalar DevStack y guardar una marca tras completar stack.sh
      become_user: stack
      ansible.builtin.shell:
        cmd: ./stack.sh && touch /opt/stack/.devstack-installed
        chdir: "{{ stack_dir }}"
        creates: /opt/stack/.devstack-installed
      no_log: true
      register: install
      failed_when: false

    - name: Comprobar que finalizó la instalación
      ansible.builtin.assert:
        that: (install.rc | default(0)) == 0
        fail_msg: Revisa /opt/stack/logs/stack.sh.log en el nodo con un usuario autorizado.
      when: not ansible_check_mode
